app = 'mosaic-api'
primary_region = 'cdg'

[build]

[mounts]
  source = "mosaic_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'performance'
  cpus = 1
  memory_mb = 4096
